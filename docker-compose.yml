services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Database name is required}
      POSTGRES_USER: ${DB_USERNAME:?Database username is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password is required}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecommerce-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:?Database name is required}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:?Database username is required}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Database password is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT secret key is required}
      SECURITY_PEPPER: ${SECURITY_PEPPER:?Security pepper key is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Admin email is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Admin initial password is required}
      CUSTOMER_EMAIL: ${CUSTOMER_EMAIL:?Customer email is required}
      CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD:?Customer initial password is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ecommerce-network

volumes:
  pgdata:

networks:
  ecommerce-network:
    driver: bridge