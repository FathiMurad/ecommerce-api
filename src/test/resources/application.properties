# suppress inspection "UnusedProperty" for whole file
spring.application.name=ecommerce-api-test

# Test Database Connection (supports local Postgres default & CI env overrides)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:DockerPostgresPassword123!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Settings for Tests
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Security & Pepper for Tests (Fixed dummy key for repeatable testing)
app.security.pepper=c2VjdXJpdHktcGVwcGVyLWZvci10ZXN0aW5nLW9ubHktMTIzNDU2Nzg5MA==
app.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.security.jwt.expiration=86400000

# Data Seeder Configuration for Integration Tests
app.init.admin.email=admin@ecommerce.com
app.init.admin.password=Admin@123456
app.init.customer.email=customer@ecommerce.com
app.init.customer.password=Customer@123456
app.init.catalog.enabled=true

# Actuator & Observability for Tests
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true

# Background Scheduling for Tests (Disabled to keep integration tests deterministic)
spring.task.scheduling.enabled=false