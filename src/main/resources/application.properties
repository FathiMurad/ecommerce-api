spring.application.name=ecommerce-api
server.port=8080

# Graceful Shutdown (Essential for zero-downtime deployments and containerized environments)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# PostgreSQL Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Enterprise Connection Pooling
spring.datasource.hikari.pool-name=EcommerceHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Request Size & Multipart Limiting (DoS Protection)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Security Pepper (Injected via Environment Variable in Production/Staging)
app.security.pepper=${APP_SECURITY_PEPPER:local-dev-default-pepper-secret-key-32bytes}

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Data Seeder Initial Accounts (Configured via Env Variables with Dev Fallbacks)
app.init.admin-email=${APP_INIT_ADMIN_EMAIL:admin@ecommerce.com}
app.init.admin-password=${APP_INIT_ADMIN_PASSWORD:Admin123456!}
app.init.customer-email=${APP_INIT_CUSTOMER_EMAIL:customer@ecommerce.com}
app.init.customer-password=${APP_INIT_CUSTOMER_PASSWORD:Customer123456!}

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha