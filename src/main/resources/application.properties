spring.application.name=ecommerce-api
server.port=8080

# PostgreSQL Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Security Pepper (Injected via Environment Variable in Production/Staging)
app.security.pepper=${APP_SECURITY_PEPPER:local-dev-default-pepper-secret-key-32bytes}

# JWT Configuration
application.security.jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=86400000

# Data Seeder Initial Accounts (Configured via Env Variables with Dev Fallbacks)
app.init.admin-email=${APP_INIT_ADMIN_EMAIL:admin@ecommerce.com}
app.init.admin-password=${APP_INIT_ADMIN_PASSWORD:Admin@123456}
app.init.customer-email=${APP_INIT_CUSTOMER_EMAIL:customer@ecommerce.com}
app.init.customer-password=${APP_INIT_CUSTOMER_PASSWORD:Customer@123456}