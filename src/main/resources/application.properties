# suppress inspection "UnusedProperty" for whole file
spring.application.name=ecommerce-api

# Server Settings
server.port=8080
server.shutdown=graceful

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Security Secrets (Fail-Fast: no default in main properties, requires env or local profile)
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=86400000
application.security.pepper=${SECURITY_PEPPER:${APP_SECURITY_PEPPER}}

# Compatibility aliases
app.security.jwt.secret-key=${application.security.jwt.secret-key}
app.security.jwt.expiration=${application.security.jwt.expiration}
app.security.pepper=${application.security.pepper}

# Initial Seeding Credentials
app.init.admin.email=${ADMIN_EMAIL:admin@ecommerce.com}
app.init.admin.password=${ADMIN_PASSWORD:Admin@123456}
app.init.customer.email=${CUSTOMER_EMAIL:customer@ecommerce.com}
app.init.customer.password=${CUSTOMER_PASSWORD:Customer@123456}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
application.cors.allowed-origins=${app.cors.allowed-origins}

# Swagger / OpenAPI documentation (Default disabled for production readiness)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Actuator & Observability
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=ecommerce-api